name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Sas.sln

      - name: Build
        run: dotnet build Sas.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/Sas.Tests/Sas.Tests.csproj -c Release --no-build --filter "Category!=Integration"

      - name: Integration tests
        run: dotnet test tests/Sas.Tests/Sas.Tests.csproj -c Release --no-build --filter "Category=Integration"

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Sas.sln -c Release

      - name: Collect coverage
        run: |
          dotnet tool install dotnet-coverage --tool-path ./.tools
          ./.tools/dotnet-coverage collect \
            "dotnet test tests/Sas.Tests/Sas.Tests.csproj -c Release --no-build" \
            -f cobertura -o coverage.xml

      - name: Enforce coverage threshold
        run: |
          python3 - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          # CLI interaction code (interactive wizard, admin/cluster prompts and
          # the program entry point) is validated manually; the gate measures
          # the protocol, trust, auth, logging and server layers.
          EXCLUDED_PREFIXES = ("Program", "Sas.Config")

          root = ET.parse("coverage.xml").getroot()
          covered = 0
          valid = 0

          for package in root.iter("package"):
              if package.get("name") != "sas":
                  continue
              for cls in package.iter("class"):
                  name = cls.get("name", "")
                  if name.startswith(EXCLUDED_PREFIXES):
                      continue
                  for line in cls.iter("line"):
                      valid += 1
                      if int(line.get("hits", "0")) > 0:
                          covered += 1

          rate = covered / valid if valid else 0.0
          print(f"core line coverage: {covered}/{valid} = {rate:.1%}")

          if rate < 0.75:
              sys.exit(f"coverage gate failed: {rate:.1%} < 75%")
          EOF
